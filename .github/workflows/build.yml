name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -d "homework_aggregator_android" ]; then
            cd homework_aggregator_android
          fi
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p ../output_apk
          cp app/build/outputs/apk/debug/app-debug.apk ../output_apk/ 2>/dev/null || cp app/build/outputs/apk/debug/*.apk ../output_apk/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HomeworkAssistant-Debug-APK
          path: |
            output_apk/*.apk
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
